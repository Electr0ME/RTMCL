[workspace]
members = ["crates/launcher-app", "crates/launcher-terminal"]
default-members = ["crates/launcher-terminal"]
exclude = ["vendor/lighty"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
repository = "https://github.com/Electr0ME/RTMCL"

[workspace.dependencies]
launcher-app = { path = "crates/launcher-app" }
lighty-launcher = { path = "vendor/lighty", version = "=26.9.3", default-features = false, features = ["vanilla", "fabric", "events"] }
serde_json = "1"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "stream"] }
sha1 = "0.11"
sha2 = "0.11"
hex = "0.4"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "6"
futures-util = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "fs", "io-util", "process", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"

# Audited fixed upstream snapshot; local changes are listed in vendor/lighty/RTMCL-PATCHES.md.
[workspace.metadata.lighty]
package = "lighty-launcher"
version = "=26.9.3"
revision = "94bd0553beeb89fa7868eb0e0a9f446ad85af793"
rust-version = "1.98"
features = ["vanilla", "fabric", "events"]
status = "p0-local-patches"
