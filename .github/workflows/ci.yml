name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --package launcher-app --package launcher-terminal -- --check
      - run: cargo clippy --workspace --all-targets --no-deps --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
